# /etc/alfilogd/alfilogd.conf

[main]
# Both paths must be readable by the alfilogd service user.
embeddingmodel=/opt/alfilogd/models/bge-small-en-v1.5
classifier=/opt/alfilogd/models/micro-log-state-v3.pt

device=auto
config_dir=/etc/alfilogd/conf.d
output_base=/var/alfilogd
state_base=/var/lib/alfilogd
runtime_dir=/run/alfilogd
socket=/run/alfilogd/alfilogd.sock

# Shared defaults. Every facility may override these values.
batch_size=64
batch_wait_ms=25
queue_size=10000
pollingrate=5m
polling_lines=500
recovery_time=60m
dedupe_time=2h
status_write_interval=10s
start_position=cursor
max_line_bytes=65536
socket_mode=0660
socket_group=alfilogd

[nrpe]
enabled=true
include_dir=/etc/nagios/nrpe.d
main_config=/etc/nagios/nrpe.cfg
service_name=nrpe
generated_name=alfilogd.cfg
validate_command=/usr/sbin/nrpe -c /etc/nagios/nrpe.cfg -n
reload_command=/usr/bin/systemctl reload nrpe
